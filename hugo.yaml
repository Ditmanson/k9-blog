baseURL: "https://griz.sh/"
title: "K9-Communication LLC’s Blog"

taxonomies:
  category: "categories"
  tag: "tags"

# Category and Tag names show as written ("e-collar", not "E-Collar").
capitalizeListTitles: false

# The Feed is the home page, so there's no /posts/ list.
disableKinds: ["section"]

# JSON on the home page is the search index, also read by the business site's chat agent.
outputs:
  home:
    - HTML
    - RSS
    - JSON

pagination:
  pagerSize: 12

# Flat Post URLs, whatever folder the file is in (ADR 0001).
permalinks:
  page:
    posts: "/posts/:slugorcontentbasename/"

params:
  # noindex on every page until cutover to griz.sh (issue #17 removes it).
  preview: true

  description: "Gear, dogs, training, food, and adventures: the dog blog of K9-Communication LLC in Colorado Springs, CO."

  # The business site, linked from the header and footer.
  businessURL: "https://k9-communication.com/"
